name: Ship to Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Push to main already triggers Vercel Production via the Vercel GitHub app.
# This workflow documents that path and optionally re-deploys with the CLI
# when VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets exist.
jobs:
  production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm GitHub → Vercel Production path
        run: |
          echo "main push → Vercel Production (GitHub integration)"
          echo "Live: https://shortnews-theta.vercel.app"
          echo "Commit: ${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Optional Vercel CLI production deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Vercel secrets not set. Relying on Vercel GitHub integration for Production."
            exit 0
          fi
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
