name: Ship to Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Vercel GitHub integration already deploys Production on main.
# This workflow makes the ship path explicit and optionally runs the
# Vercel CLI when repository secrets are configured.
jobs:
  production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Note GitHub → Vercel auto deploy
        run: |
          echo "Push to main triggers Vercel Production via the Vercel GitHub app."
          echo "Live site: https://shortnews-theta.vercel.app"

      - name: Optional Vercel CLI production deploy
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
